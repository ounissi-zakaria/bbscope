services:
  bbscope-web:
    build:
      context: ..
      dockerfile: website/Dockerfile
    restart: unless-stopped
    environment:
      DB_PATH: /data/bbscope.db
      H1_USERNAME: ${H1_USERNAME:-}
      H1_TOKEN: ${H1_TOKEN:-}
      BC_EMAIL: ${BC_EMAIL:-}
      BC_PASSWORD: ${BC_PASSWORD:-}
      BC_OTP: ${BC_OTP:-}
      BC_PUBLIC_ONLY: ${BC_PUBLIC_ONLY:-}
      IT_TOKEN: ${IT_TOKEN:-}
      YWH_EMAIL: ${YWH_EMAIL:-}
      YWH_PASSWORD: ${YWH_PASSWORD:-}
      YWH_OTP: ${YWH_OTP:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
    volumes:
      - bbscope_data:/data
    command: ["serve", "--poll-interval", "${POLL_INTERVAL:-6}", "--domain", "${DOMAIN:-bbscope.com}"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-bbscope.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./conf.d:/etc/caddy/conf.d:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - bbscope-web

volumes:
  bbscope_data:
  caddy_data:
  caddy_config:
